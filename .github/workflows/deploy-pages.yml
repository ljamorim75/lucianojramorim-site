name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: site-v2
          persist-credentials: false
      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Build Production
        run: npm run build:prod
      - name: Validate Production Output
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          for (const file of ['index.html', 'textos/index.html', 'autor/index.html', 'contato/index.html', 'robots.txt', 'sitemap.xml', 'CNAME']) {
            assert(existsSync(`dist/${file}`), `Missing output: ${file}`);
          }
          assert.equal(readFileSync('dist/CNAME', 'utf8').trim(), 'lucianojramorim.com.br', 'Unexpected domain');
          assert(!existsSync('dist/textos/monaksia/index.html'), 'Monaksía page must remain unpublished');
          assert(!readFileSync('dist/sitemap.xml', 'utf8').includes('/textos/monaksia/'), 'Monaksía route exposed');

          function validatePages(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                validatePages(file);
              } else if (entry.name.endsWith('.html')) {
                const html = readFileSync(file, 'utf8');
                assert(!/monaks[ií]a|manuscript-placeholder|manuscript-status|Publicação em preparação/iu.test(html), `Draft content or marker in ${file}`);
              }
            }
          }
          validatePages('dist');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
