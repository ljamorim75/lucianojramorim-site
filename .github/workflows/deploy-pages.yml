name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - name: Build Production
        run: npm run build:prod
      - name: Validate Production Output
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';

          for (const file of ['index.html', 'textos/index.html', 'autor/index.html', 'contato/index.html', 'robots.txt', 'sitemap.xml', 'CNAME', '404.html']) {
            assert(existsSync(`dist/${file}`), `Missing output: ${file}`);
          }
          assert.equal(readFileSync('dist/CNAME', 'utf8').trim(), 'lucianojramorim.com.br');
          const works = JSON.parse(readFileSync('src/data/textos.json', 'utf8'));
          assert.equal(works.find((work) => work.slug === 'monaksia')?.status, 'publicado');
          assert(existsSync('dist/textos/monaksia/index.html'), 'Published story missing');
          assert(readFileSync('dist/sitemap.xml', 'utf8').includes('https://lucianojramorim.com.br/textos/monaksia/'), 'Published route missing');
          for (const file of ['dist/index.html', 'dist/textos/index.html']) {
            const html = readFileSync(file, 'utf8');
            assert(html.includes('MONAKSÍA') && !/EM BREVE/iu.test(html), `Published metadata incorrect: ${file}`);
            assert(html.includes('href="/textos/monaksia/"'), `Published link missing: ${file}`);
          }
          const story = readFileSync('dist/textos/monaksia/index.html', 'utf8');
          for (const marker of ['PROJETO MONAKSÍA', 'POPULAÇÃO: 0', 'REDE 23.5', 'INDIVÍDUO 18', 'data-reading-content']) {
            assert(story.includes(marker), `Published story marker missing: ${marker}`);
          }
          function validatePages(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                validatePages(file);
              } else if (entry.name.endsWith('.html')) {
                assert(!/manuscript-placeholder|manuscript-status|Publicação em preparação/iu.test(readFileSync(file, 'utf8')), `Draft placeholder in ${file}`);
              }
            }
          }
          validatePages('dist');
          const notFound = readFileSync('dist/404.html', 'utf8');
          assert(notFound.includes('noindex, follow'), '404 must be noindex');
          assert(notFound.includes('href="/"') && notFound.includes('href="/textos/"'), '404 navigation missing');
          assert(!/rel="canonical"|monaks[ií]a|manuscript/iu.test(notFound), 'Unexpected 404 metadata or content');
          assert(!readFileSync('dist/sitemap.xml', 'utf8').includes('/404'), '404 in sitemap');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
